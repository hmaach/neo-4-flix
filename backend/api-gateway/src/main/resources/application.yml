server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # A slow or dead service answers 504 here instead of holding the connection open.
            connect-timeout: 2000
            response-timeout: 10s
          # lb://<name> is resolved through Eureka. Routing only: each service verifies the JWT itself.
          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: movie-service
              uri: lb://movie-service
              predicates:
                - Path=/api/movies/**
            - id: rating-service
              uri: lb://rating-service
              predicates:
                - Path=/api/ratings/**
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates:
                - Path=/api/recommendations/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    # Register with the container IP, which other containers can reach, instead of a hostname.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
