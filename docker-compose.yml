services:

  neo4j:
    image: neo4j:5.26.33-community
    container_name: neo4j
    # Neo4j's own uid. The image entrypoint supports a non-root start; no privilege drop needed.
    user: "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # Graph Data Science plugin: the jar is mounted below (downloaded once by scripts/setup.sh).
      # NEO4J_PLUGINS is not used because it re-downloads the jar on every start.
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      # Neo4j sends anonymous usage data by default; off for a local demo.
      NEO4J_dbms_usage__report_enabled: "false"
      # Small footprint for a laptop. GDS projections of the seed graph are a few KB.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      # Bound to localhost only: Neo4j Browser and bolt for the audit demo, never exposed on the network.
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      # GDS jar from scripts/setup.sh, on the image's default plugins directory. Read-only: Neo4j only loads from it.
      - ./plugins:/var/lib/neo4j/plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 1g
    restart: unless-stopped

  # One-shot job: loads seed/seed.cypher once Neo4j is healthy. Idempotent (MERGE), so re-running is safe.
  neo4j-seed:
    image: neo4j:5.26.33-community
    container_name: neo4j-seed
    user: "7474:7474"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./seed:/seed:ro
    command: ["cypher-shell", "-a", "bolt://neo4j:7687", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "-f", "/seed/seed.cypher"]
    mem_limit: 256m
    restart: "no"

  discovery-server:
    build:
      context: ./backend
      args:
        SERVICE: discovery-server
        PORT: "8761"
    container_name: discovery-server
    ports:
      # Eureka dashboard for the audit demo, localhost only.
      - "127.0.0.1:8761:8761"
    mem_limit: 512m
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
        PORT: "8080"
    container_name: api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      discovery-server:
        condition: service_healthy
    # No ports: only nginx (frontend) talks to the gateway, on the compose network.
    mem_limit: 512m
    restart: unless-stopped

  user-service:
    build:
      context: ./backend
      args:
        SERVICE: user-service
        PORT: "8081"
    container_name: user-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY}
    volumes:
      # The only service with the private key: it signs tokens. The others mount the public key only.
      - ./secrets/jwt-private.pem:/secrets/jwt-private.pem:ro
      - ./secrets/jwt-public.pem:/secrets/jwt-public.pem:ro
    depends_on:
      neo4j:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  neo4j-data:
